# Temporary: looks for candidate scanned books on the Internet Archive. Removed before merge.
name: Probe IA
on:
  push:
    branches: [claude/project-thread-i8i5w0]
    paths: [.github/workflows/probe-ia.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          queries = [
            'title:(dictionary practical materia medica) AND creator:(clarke)',
            'title:(lectures homoeopathic materia medica) AND creator:(kent)',
            'title:(repertory homoeopathic materia medica) AND creator:(kent)',
            'title:(pocket manual materia medica) AND creator:(boericke)',
            'title:(keynotes) AND creator:(allen)',
            'title:(leaders homoeopathic therapeutics) AND creator:(nash)',
            'title:(guiding symptoms) AND creator:(hering)',
            'title:(organon) AND creator:(hahnemann)',
            'title:(chronic diseases) AND creator:(hahnemann)',
            'title:(lectures homoeopathic philosophy) AND creator:(kent)',
          ]
          for q in queries:
            u = 'https://archive.org/advancedsearch.php?' + urllib.parse.urlencode({'q': q + ' AND mediatype:texts', 'fl[]': ['identifier','title','year','volume','date'], 'rows': 12, 'output': 'json'}, doseq=True)
            docs = json.load(urllib.request.urlopen(u))['response']['docs']
            print('\n###', q, len(docs))
            for d in docs:
              ident = d['identifier']
              try:
                m = json.load(urllib.request.urlopen('https://archive.org/metadata/' + ident))
              except Exception as e:
                print('  ', ident, 'ERR', e); continue
                continue
              md = m.get('metadata', {})
              names = {f['name'] for f in m.get('files', [])}
              pn = ident + '_page_numbers.json' in names
              st = ident + '_hocr_searchtext.txt.gz' in names
              print('  ', ident, '|', md.get('title'), '|', md.get('volume'), '|', md.get('year') or md.get('date'), '|', md.get('possible-copyright-status'), '|', md.get('publisher'), '| pages', md.get('imagecount'), '| pn', pn, 'st', st, '| conf', md.get('page_number_confidence'))
          PY
